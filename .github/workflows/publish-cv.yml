name: Publish academic CV
on:
  push:
    branches: [master]
    paths:
      - 'Yichen_Pan_Academic_CV.tex'
      - '.github/workflows/publish-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Yichen_Pan_Academic_CV.tex
          latexmk_use_xelatex: false
      - name: Publish cv.pdf
        run: |
          cp Yichen_Pan_Academic_CV.pdf cv.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cv.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update website CV from LaTeX"
            git push
          fi
